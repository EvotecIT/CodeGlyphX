version: 2
updates:
- package-ecosystem: nuget
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:41"
    timezone: Etc/UTC
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:41"
    timezone: Etc/UTC
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
