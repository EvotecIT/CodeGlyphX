name: Project Manifest

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "Build/Export-ProjectManifest.ps1"
      - "CodeGlyphX/**/*.csproj"
      - "WebsiteArtifacts/project-manifest.json"
  push:
    branches:
      - master
      - main
    paths:
      - "Build/Export-ProjectManifest.ps1"
      - "CodeGlyphX/**/*.csproj"
      - "WebsiteArtifacts/project-manifest.json"

concurrency:
  # PRs replace only their own older runs; every other event has a unique group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-manifest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Manifest
        shell: pwsh
        run: |
          ./Build/Export-ProjectManifest.ps1

      - name: Verify Manifest Is Committed
        shell: pwsh
        run: |
          git diff --exit-code -- WebsiteArtifacts/project-manifest.json

      - name: Upload Manifest Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-manifest
          path: WebsiteArtifacts/project-manifest.json
