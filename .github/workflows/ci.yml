name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-framework:
    name: Test (${{ matrix.os }}, ${{ matrix.framework }})
    # Prefer private/self-hosted runners for private repos to reduce hosted spend.
    runs-on: ${{ fromJSON(github.event.repository.private && matrix.selfHostedRunner || format('["{0}"]', matrix.os)) }}
    # Every platform runs the .NET 8 and .NET 10 corpora; Windows also runs .NET Framework.
    # Allow build and shutdown headroom after the macOS corpora finish near twenty minutes.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 45 }}
    env:
      # The default all-format DataBar corpus scan needs a larger budget on Linux runners.
      CODEGLYPHX_TEST_BUDGET_MULTIPLIER: ${{ matrix.testBudgetMultiplier }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net8.0
            selfHostedRunner: '["self-hosted","linux"]'
            testBudgetMultiplier: '4'
          - os: ubuntu-latest
            framework: net10.0
            selfHostedRunner: '["self-hosted","linux"]'
            testBudgetMultiplier: '4'
          - os: macos-latest
            framework: net8.0
            selfHostedRunner: '["self-hosted","macOS"]'
            testBudgetMultiplier: '1'
          - os: macos-latest
            framework: net10.0
            selfHostedRunner: '["self-hosted","macOS"]'
            testBudgetMultiplier: '1'
          - os: windows-latest
            framework: net8.0
            selfHostedRunner: '["self-hosted","windows"]'
            testBudgetMultiplier: '1'
          - os: windows-latest
            framework: net10.0
            selfHostedRunner: '["self-hosted","windows"]'
            testBudgetMultiplier: '1'
          - os: windows-latest
            framework: net472
            selfHostedRunner: '["self-hosted","windows"]'
            testBudgetMultiplier: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build complete solution
        if: runner.os == 'Windows' && matrix.framework == 'net8.0'
        run: dotnet build CodeGlyphX.sln -c Release --nologo

      - name: Build test framework
        if: runner.os != 'Windows' || matrix.framework != 'net8.0'
        run: dotnet build CodeGlyphX.Tests/CodeGlyphX.Tests.csproj -c Release -f ${{ matrix.framework }} --nologo

      - name: Build portable projects
        if: runner.os != 'Windows' && matrix.framework == 'net8.0'
        run: |
          dotnet build CodeGlyphX/CodeGlyphX.csproj -c Release -f netstandard2.0 --nologo
          dotnet build CodeGlyphX.Examples/CodeGlyphX.Examples.csproj -c Release --nologo
          dotnet build CodeGlyphX.Fuzz/CodeGlyphX.Fuzz.csproj -c Release --nologo

      - name: Download hash-pinned test corpora
        shell: pwsh
        run: |
          ./Build/Download-ImageSamples.ps1 -NoUpdateManifest
          ./Build/Download-ExternalSamples.ps1 -NoUpdateManifest

      - name: Test (${{ matrix.framework }})
        run: dotnet test CodeGlyphX.Tests/CodeGlyphX.Tests.csproj -c Release -f ${{ matrix.framework }} --no-restore --no-build

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: test-framework
    if: always()
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Require every framework suite
        env:
          TEST_RESULT: ${{ needs.test-framework.result }}
        run: test "$TEST_RESULT" = success

  release-contracts:
    name: Package & NativeAOT contracts
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Pack release artifacts
        run: dotnet pack CodeGlyphX/CodeGlyphX.csproj -c Release -o artifacts/packages --nologo

      - name: Validate package contents
        shell: pwsh
        run: ./Build/Assert-Package.ps1 -PackageDirectory artifacts/packages

      - name: Restore isolated package consumer
        run: dotnet restore Build/PackageConsumer/PackageConsumer.csproj --configfile Build/PackageConsumer/NuGet.config --packages artifacts/package-consumer-cache --nologo

      - name: Compile package consumer for supported runtimes
        run: dotnet build Build/PackageConsumer/PackageConsumer.csproj -c Release --no-restore --nologo

      - name: Run package consumer (net8.0)
        run: dotnet run --project Build/PackageConsumer/PackageConsumer.csproj -c Release -f net8.0 --no-restore --no-build

      - name: Run package consumer (net10.0)
        run: dotnet run --project Build/PackageConsumer/PackageConsumer.csproj -c Release -f net10.0 --no-restore --no-build

      - name: Publish NativeAOT consumer
        run: dotnet publish CodeGlyphX.Examples/CodeGlyphX.Examples.csproj -c Release -f net8.0 -r linux-x64 -p:PublishAot=true --self-contained true -o artifacts/aot-smoke --nologo

      - name: Run NativeAOT public API smoke test
        env:
          CODEGLYPHX_CI_SMOKE: "1"
          CODEGLYPHX_OUTPUT_DIR: ${{ github.workspace }}/artifacts/aot-output
        run: ./artifacts/aot-smoke/CodeGlyphX.Examples

  website-build:
    name: Website Build (PR)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@396e00acba04dcaae4c3c95433338f4df65fbc01
    with:
      website_root: Website
      pipeline_config: Website/pipeline.website-ci.json
      engine_mode: source
      authenticate_public_github_data: true
      runner_labels_json: ${{ github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 396e00acba04dcaae4c3c95433338f4df65fbc01
      report_artifact_name: powerforge-website-reports
