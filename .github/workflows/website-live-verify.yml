name: Verify Live Website and Cloudflare

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verify:
    permissions:
      actions: write
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@9f2d36a18c8334d9a27587f04b38ad0dc9bd515d
    with:
      website_root: Website
      pipeline_config: Website/pipeline.cloudflare.json
      source_ref: master
      engine_mode: source
      runner_labels_json: '["ubuntu-latest"]'
      timeout_minutes: 30
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 9f2d36a18c8334d9a27587f04b38ad0dc9bd515d
      report_artifact_name: codeglyphx-cloudflare-live-reports
      use_playwright_cache: false
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID_CODEGLYPHX }}
