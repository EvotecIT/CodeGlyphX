name: Deploy Website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "CodeGlyphX/**"
      - "CodeGlyphX.Playground/**"
      - "CodeGlyphX.Website/**"
      - "Directory.Build.props"
      - "NuGet.config"
      - ".github/workflows/website-deploy.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeglyphx-website-production
  cancel-in-progress: false

jobs:
  build:
    permissions:
      actions: write
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@396e00acba04dcaae4c3c95433338f4df65fbc01
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      source_ref: ${{ github.event_name == 'release' && 'master' || '' }}
      engine_mode: source
      runner_labels_json: '["ubuntu-latest"]'
      timeout_minutes: 60
      upload_pages_artifact: true
      pages_artifact_path: Website/_site
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 396e00acba04dcaae4c3c95433338f4df65fbc01
      report_artifact_name: codeglyphx-website-deploy-reports
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  site-policy:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Apply managed Cloudflare site policy and purge the deployed hostname
        uses: EvotecIT/PSPublishModule/.github/actions/powerforge-cloudflare-site-policy@2e5374485f28c4927f571525ef80652e5fd3af82
        with:
          site-config: Website/site.json
          checkout-caller: "false"
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          purge-after-policy: "true"
