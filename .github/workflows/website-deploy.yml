name: Deploy Website

on:
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "CodeGlyphX/**"
      - "CodeGlyphX.Playground/**"
      - "CodeGlyphX.Website/**"
      - "Directory.Build.props"
      - "NuGet.config"
      - ".github/workflows/website-deploy.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeglyphx-website-production
  cancel-in-progress: false

jobs:
  build:
    permissions:
      actions: write
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@1dbcec06df408947ee5f0dad3f71a11b0d31b0b6
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      source_ref: ${{ github.event_name == 'release' && 'master' || '' }}
      engine_mode: source
      runner_labels_json: '["ubuntu-latest"]'
      timeout_minutes: 60
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 1dbcec06df408947ee5f0dad3f71a11b0d31b0b6
      report_artifact_name: codeglyphx-website-deploy-reports
      site_artifact_name: powerforge-site-codeglyphx.com
      site_artifact_retention_days: 7
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}

  site-policy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Apply managed Cloudflare site policy
        uses: EvotecIT/PSPublishModule/.github/actions/powerforge-cloudflare-site-policy@f2c4e9b4fc5bd624dcee64b2d766b471c4676387
        with:
          site-config: Website/site.json
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    needs: [build, site-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://codeglyphx.com
    permissions:
      actions: read
      contents: read
    steps:
      - name: Deploy validated website artifact
        uses: EvotecIT/PSPublishModule/.github/actions/powerforge-linux-site-deploy@f2c4e9b4fc5bd624dcee64b2d766b471c4676387
        with:
          artifact-name: powerforge-site-codeglyphx.com
          deployment-site: codeglyphx.com
          deployment-host: ${{ vars.POWERFORGE_WEBSITE_DEPLOY_HOST }}
          deployment-port: ${{ vars.POWERFORGE_WEBSITE_DEPLOY_PORT }}
          deployment-user: ${{ vars.POWERFORGE_WEBSITE_DEPLOY_USER }}
          deployment-cloudflare-zone: codeglyphx.com
          deployment-ssh-private-key: ${{ secrets.DEPLOYMENT_SSH_PRIVATE_KEY }}
          deployment-ssh-known-hosts: ${{ secrets.DEPLOYMENT_SSH_KNOWN_HOSTS }}
          deployment-cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          deployment-public-url: https://codeglyphx.com
          deployment-smoke-paths: "/ /docs/ /api/ /playground/ /sitemap.xml"
          source-repository: ${{ github.repository }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          engine-mode: ${{ needs.build.outputs.engine_mode }}
          engine-repository: ${{ needs.build.outputs.engine_repository }}
          engine-ref: ${{ needs.build.outputs.engine_ref }}
          engine-sha: ${{ needs.build.outputs.engine_sha }}
          engine-asset: ${{ needs.build.outputs.engine_asset }}
          engine-asset-sha256: ${{ needs.build.outputs.engine_asset_sha256 }}

  post-deploy:
    needs: [build, deploy]
    permissions:
      actions: write
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@1dbcec06df408947ee5f0dad3f71a11b0d31b0b6
    with:
      website_root: Website
      pipeline_config: Website/pipeline.cloudflare.json
      source_ref: ${{ needs.build.outputs.source_sha }}
      engine_mode: source
      runner_labels_json: '["ubuntu-latest"]'
      timeout_minutes: 30
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 1dbcec06df408947ee5f0dad3f71a11b0d31b0b6
      report_artifact_name: codeglyphx-cloudflare-post-deploy-reports
      use_playwright_cache: false
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID_CODEGLYPHX }}
