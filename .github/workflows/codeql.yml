name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  # PRs replace only their own older runs; every other event has a unique group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  codeql:
    name: Run CodeQL analysis
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Prefer private/self-hosted runners for private repos to reduce hosted spend.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: csharp

      - name: Restore
        run: |
          dotnet restore CodeGlyphX/CodeGlyphX.csproj -p:TargetFramework=net8.0

      - name: Build
        run: |
          dotnet build CodeGlyphX/CodeGlyphX.csproj -c Release -f net8.0 --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:csharp'

  analyze:
    name: Analyze
    needs: [changes, codeql]
    if: always()
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Require selected CodeQL analysis
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          ANALYSIS_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$BUILD_REQUIRED" = false ] && [ "$ANALYSIS_RESULT" = skipped ]; then
            echo 'Documentation/website-only PR; CodeQL analysis is not needed.'
            exit 0
          fi
          test "$BUILD_REQUIRED" = true
          test "$ANALYSIS_RESULT" = success
