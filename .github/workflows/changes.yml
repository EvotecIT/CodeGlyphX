name: Select CI coverage

on:
  workflow_call:
    outputs:
      build:
        description: Whether library, test and package validation is needed
        value: ${{ jobs.changes.outputs.build }}
      website:
        description: Whether the website build is needed
        value: ${{ jobs.changes.outputs.website }}
      matrix:
        description: Framework and platform test matrix
        value: ${{ jobs.changes.outputs.matrix }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      website: ${{ steps.plan.outputs.website }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select coverage
        id: plan
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          def docs_only(path):
              # Generated contracts, packaged Markdown and scan fixtures are inputs,
              # even when they live alongside documentation or website content.
              inputs = (
                  "README.md", "THIRD-PARTY-NOTICES.md", "BENCHMARK.md",
                  "Website/data/formats.json",
                  "Website/content/docs/symbol-capabilities.md",
              )
              input_dirs = (
                  "Website/build/", "Website/tools/", "Website/data/", "Website/static/images/",
                  "Website/static/assets/", "docs/comparisons/", "docs/api/",
                  "docs/generated/", "docs/schema/", "docs/schemas/",
              )
              parts = PurePosixPath(path).parts
              code_suffixes = (".cs", ".csproj", ".props", ".targets", ".ps1", ".py", ".sh")
              if (path in inputs or path.startswith(input_dirs)
                      or "schema" in parts or "schemas" in parts
                      or path.endswith((".schema.json",) + code_suffixes)):
                  return False
              return (path.startswith("Website/")
                      or path.startswith("docs/") and path.endswith(".md")
                      or path.endswith(".md") and len(parts) == 1
                      or path == ".github/workflows/README.md")

          event = os.environ["GITHUB_EVENT_NAME"]
          paths = []
          if event == "pull_request":
              # No rename detection: moving source into docs must include its deletion.
              diff = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"], "--",
              ])
              paths = diff.decode("utf-8").split("\0")
              paths = [path for path in paths if path]
          build = event != "pull_request" or not paths or any(not docs_only(path) for path in paths)
          # Shared build inputs run everything. PRs build the website for website, playground and shared
          # changes; library-only PRs leave it to the default-branch deployment, while the Windows solution
          # build still compiles the website and playground projects.
          def shared(path):
              name = PurePosixPath(path).name
              return (path.startswith(".github/") and path != ".github/workflows/README.md"
                      or name.startswith("Directory.Build.") or name in ("global.json", "NuGet.config")
                      or name in ("packages.lock.json", "package-lock.json")
                      or name.endswith(".sln"))
          full = event != "pull_request" or not paths or any(shared(path) for path in paths)
          website = full or any(
              path.startswith(("Website/", "CodeGlyphX.Website/", "CodeGlyphX.Playground/", "docs/comparisons/"))
              or path in ("docs/fair-comparisons.md", "README.md")
              for path in paths
          )
          # The serial image-scanner collection is most of each modern suite's time, so those suites run in three
          # shards. The first two take the slowest scanner classes; the last takes everything else, so new tests
          # always run. Collections stay serial inside each shard's process.
          heavy = [
              ["QrArtWave1ScanTests", "QrScreenshotDecodeTests", "PlaygroundLivePreviewTests", "QrGalleryScanTests"],
              ["QrArtPremiumScanTests", "QrDecodingSamplesTests", "QrMultiDecodeTests"],
          ]
          prefix = "FullyQualifiedName~CodeGlyphX.Tests."
          shards = ["|".join(prefix + name + "." for name in group) for group in heavy]
          shards.append("&".join(prefix.replace("~", "!~") + name + "." for group in heavy for name in group))
          include = []
          for platform, label, budget, frameworks in [
              ("ubuntu-latest", "linux", "4", ["net8.0", "net10.0"]),
              ("macos-latest", "macOS", "1", ["net8.0", "net10.0"]),
              ("windows-latest", "windows", "1", ["net8.0", "net10.0", "net472"]),
          ]:
              if event == "pull_request" and platform == "macos-latest":
                  continue
              # PRs run both modern frameworks on Linux. Windows keeps .NET 8 (complete solution build)
              # and .NET Framework; its .NET 10 suite runs for shared build inputs, default-branch pushes and
              # manual runs.
              if not full and platform == "windows-latest":
                  frameworks = ["net8.0", "net472"]
              for framework in frameworks:
                  lane = dict(os=platform, framework=framework,
                              selfHostedRunner=json.dumps(["self-hosted", label]),
                              testBudgetMultiplier=budget)
                  # .NET Framework is quicker, and macOS runs only on full runs, where its job count is kept low.
                  if framework == "net472" or platform == "macos-latest":
                      include.append(dict(lane, shard="", testFilter="", primary=True))
                      continue
                  for index, test_filter in enumerate(shards):
                      include.append(dict(lane, shard=str(index + 1) + "/" + str(len(shards)),
                                          testFilter=test_filter, primary=index == 0))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("build=" + str(build).lower() + "\n")
              output.write("website=" + str(website).lower() + "\n")
              output.write("matrix=" + json.dumps(dict(include=include)) + "\n")
          print("Full library validation required." if build else "Documentation/website-only PR; library validation skipped.")
          print("Selected " + str(len(include)) + " framework/platform/shard lanes.")
