<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  {{DESCRIPTION_META}}
  {{OPEN_GRAPH_META}}
  <link rel="preconnect" href="https://img.shields.io" crossorigin />
  <link rel="dns-prefetch" href="https://img.shields.io" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  {{CRITICAL_CSS}}
  {{CSS}}
</head>
<body class="{{BODY_CLASS}}">
{{HEADER}}
<header class="cgx-pagehead">
  <div class="cgx-pagehead__inner">
    <div class="cgx-pagehead__copy">
      <h1>API reference</h1>
      <p class="cgx-pagehead__lede">Every public type in the CodeGlyphX package, generated from the XML documentation and linked to its source on GitHub.</p>
    </div>
    <figure class="cgx-pagehead__glyph">
      <span class="cgx-pagehead__frame"><img src="/specimens/datamatrix.svg" alt="Data Matrix encoding LOT-2026-0042, drawn by CodeGlyphX" loading="eager" decoding="async" /></span>
      <figcaption>Data Matrix <code>LOT-2026-0042</code></figcaption>
    </figure>
  </div>
</header>
<div class="api-layout{{SIDEBAR_CLASS}}">
  <button class="sidebar-toggle" type="button" aria-label="Toggle API navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
    <span>API Navigation</span>
  </button>
  <div class="sidebar-overlay"></div>
  <aside class="api-sidebar">
{{SIDEBAR}}
  </aside>
  <main class="api-content">
{{MAIN}}
  </main>
</div>
{{FOOTER}}
{{DOCS_SCRIPT}}
</body>
</html>
