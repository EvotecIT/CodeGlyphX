{{~ d = data.landing.decode ~}}
<section class="cgx-section cgx-decode" aria-labelledby="cgx-decode-title">
  <div class="cgx-decode__copy">
    <h2 id="cgx-decode-title">{{ d.title }}</h2>
    <p>{{ d.body }}</p>
    <p><a class="cgx-link" href="/docs/decoding/">Read the decoding guide and its limits</a></p>
  </div>
  <pre class="cgx-code"><code class="language-csharp">{{ d.code | html.escape }}</code></pre>
</section>
