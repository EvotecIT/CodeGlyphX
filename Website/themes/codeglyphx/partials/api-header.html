<!-- Fallback only: the pipeline passes headerHtml (_temp/chrome/api-header.html or ps-header.html), which
     build/SiteChrome.cs copies from the header the site build rendered, so the API pages share it exactly. -->
<header class="header cgx-header">
  <nav class="nav cgx-nav" aria-label="Main">
    <a href="{{BRAND_URL}}" class="brand"><span class="brand-icon"><img src="{{BRAND_ICON}}" alt="" width="32" height="32" /></span><span>{{SITE_NAME}}</span></a>
    <div class="cgx-nav__sheet">
      <div class="nav-links">{{NAV_LINKS}}</div>
      <div class="nav-actions">{{NAV_ACTIONS}}</div>
    </div>
  </nav>
</header>
