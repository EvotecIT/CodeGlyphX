<script>
(function () {
  // Mobile nav toggle.
  var navToggle = document.getElementById('nav-toggle');
  if (navToggle) {
    navToggle.addEventListener('change', function () {
      document.body.classList.toggle('nav-open', this.checked);
    });
  }

  // Specimen filter on the home page. Code blocks, the style board and theme switching live in /js/site.js.
  var filters = document.querySelector('[data-cgx-filters]');
  var grid = document.querySelector('[data-cgx-specimens]');
  if (!filters || !grid) return;
  filters.querySelectorAll('button').forEach(function (button) {
    button.addEventListener('click', function () {
      var value = button.getAttribute('data-filter');
      filters.querySelectorAll('button').forEach(function (other) {
        other.setAttribute('aria-pressed', other === button ? 'true' : 'false');
      });
      grid.querySelectorAll('[data-family]').forEach(function (tile) {
        tile.hidden = value !== 'all' && tile.getAttribute('data-family') !== value;
      });
    });
  });
})();
</script>
